name: Check Huddle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: huddle
          POSTGRES_PASSWORD: huddle-ci
          POSTGRES_DB: huddle_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U huddle -d huddle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgresql://huddle:huddle-ci@localhost:5432/huddle_ci
      PLAYWRIGHT_CHANNEL: chrome
      HUDDLE_UI_MAILPIT_URL: http://127.0.0.1:8025
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test:email
        env:
          TEST_SMTP_HOST: 127.0.0.1
          TEST_SMTP_PORT: '1025'
          TEST_MAILPIT_URL: http://127.0.0.1:8025
      - run: pnpm test:integration
      - name: Verify passwordless security
        working-directory: apps/server
        run: |
          node --env-file=../../.env --import tsx scripts/access-test-server.ts &
          access_server_pid=$!
          trap 'kill "$access_server_pid" 2>/dev/null || true; wait "$access_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            curl --fail --silent http://localhost:3000/api/health && break
            sleep 0.2
          done
          curl --fail --silent http://localhost:3000/api/health
          pnpm test:access
          node --env-file=../../.env --import tsx scripts/access-body-check.ts
      - name: Verify company recovery and restart boundaries
        working-directory: apps/server
        run: |
          node --env-file=../../.env --import tsx scripts/company-discovery-check.ts
          export PORT=3180 WS_PORT=3181 SERVER_URL=http://localhost:3180
          export OIDC_FIXTURE_PORT=3184 OIDC_FIXTURE_ISSUER=http://127.0.0.1:3184
          export OIDC_DISCOVERY_URL="$OIDC_FIXTURE_ISSUER/.well-known/openid-configuration"
          export OIDC_CLIENT_ID=huddle-test OIDC_CLIENT_SECRET=huddle-test-secret
          export OIDC_FIXTURE_EMAIL="review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@huddle.test"
          export OIDC_FIXTURE_SUBJECT="review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node ../../tests/fixtures/oidc-provider.mjs &
          oidc_fixture_pid=$!
          trap 'kill "$oidc_fixture_pid" 2>/dev/null || true; wait "$oidc_fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            curl --fail --silent "$OIDC_DISCOVERY_URL" && break
            sleep 0.2
          done
          curl --fail --silent "$OIDC_DISCOVERY_URL"
          node --env-file=../../.env --import tsx scripts/access-review-check.ts
      - run: pnpm test:ui

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @huddle/desktop build
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
