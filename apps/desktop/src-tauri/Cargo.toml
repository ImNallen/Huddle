[package]
name = "huddle"
version = "0.1.0"
description = "A home for your team's conversations"
authors = ["Huddle contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "huddle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
url = "2"
