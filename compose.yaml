services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: huddle
      POSTGRES_USER: huddle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U huddle -d huddle']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: huddle
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace mode forwards a peer's direct connection to this node's IP onto loopback, past Serve,
      # where the peer could forge identity headers. Kernel networking keeps loopback private.
      TS_USERSPACE: 'false'
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    restart: unless-stopped
  server:
    image: huddle:current
    build: .
    network_mode: service:tailscale
    env_file: .env
    environment:
      DATABASE_URL: postgresql://huddle:${POSTGRES_PASSWORD}@db:5432/huddle
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
      tailscale:
        condition: service_started
        # The shared network namespace dies with the sidecar.
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: service:tailscale
    environment:
      # Not `:?`. Compose interpolates every service, so a required secret would stop `up`, `run`, and `pull` on an .env from before voice.
      # With no secret, LiveKit refuses every token.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: [127.0.0.1]
        rtc:
          udp_port: 7882
          tcp_port: 0
          use_external_ip: false
          interfaces:
            includes: [tailscale0]
        keys:
          ${LIVEKIT_API_KEY:-huddle}: ${LIVEKIT_API_SECRET:-}
    depends_on:
      tailscale:
        condition: service_started
        restart: true
    restart: unless-stopped
  livekit-dev:
    profiles: [dev]
    image: livekit/livekit-server:v1.13.11
    ports:
      - '127.0.0.1:${LIVEKIT_PORT:-7880}:7880'
      # A mapped UDP port would advertise the container's port as the ICE candidate, so both sides match.
      - '127.0.0.1:${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp'
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          tcp_port: 0
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          ${LIVEKIT_API_KEY:-huddle}: ${LIVEKIT_API_SECRET:-}
    restart: unless-stopped
volumes:
  postgres-data:
  tailscale-state:
